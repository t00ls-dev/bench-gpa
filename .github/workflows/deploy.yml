name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Package .output
        run: tar czf output.tar.gz -C .output .

      - name: Deploy via HTTP
        run: |
          STATUS=$(curl -s -o /tmp/deploy-resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_SECRET }}" \
            --data-binary @output.tar.gz \
            https://gpa.t00ls.dev/deploy)
          echo "HTTP $STATUS"
          cat /tmp/deploy-resp.txt
          [ "$STATUS" = "200" ] || exit 1
