name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Debug - check SSH key fingerprint
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key
          echo "---"
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no -o PasswordAuthentication=no -o BatchMode=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo SSH_OK" 2>&1 || true

      - name: Upload .output via scp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: .output/
          target: /home/admin/web/gpa.t00ls.dev/public_html/.output.new/
          strip_components: 1
          rm: true

      - name: Atomic swap + Restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo chown -R admin:www-data /home/admin/web/gpa.t00ls.dev/public_html/.output.new/
            sudo rm -rf /home/admin/web/gpa.t00ls.dev/public_html/.output.old
            sudo mv /home/admin/web/gpa.t00ls.dev/public_html/.output /home/admin/web/gpa.t00ls.dev/public_html/.output.old 2>/dev/null
            sudo mv /home/admin/web/gpa.t00ls.dev/public_html/.output.new /home/admin/web/gpa.t00ls.dev/public_html/.output
            sudo -u admin pm2 reload bench-gpa 2>&1
            sudo -u admin pm2 save 2>&1
            sudo rm -rf /home/admin/web/gpa.t00ls.dev/public_html/.output.old 2>/dev/null
