name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Upload .output via rsync
        shell: bash
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/deploy_key << 'KEYEOF'
${{ secrets.SSH_PRIVATE_KEY }}
KEYEOF
          chmod 600 ~/.ssh/deploy_key
          rsync -az --delete -e "ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            .output/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/admin/web/gpa.t00ls.dev/public_html/.output.new/

      - name: Atomic swap + Restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo chown -R admin:www-data /home/admin/web/gpa.t00ls.dev/public_html/.output.new/
            sudo rm -rf /home/admin/web/gpa.t00ls.dev/public_html/.output.old
            sudo mv /home/admin/web/gpa.t00ls.dev/public_html/.output /home/admin/web/gpa.t00ls.dev/public_html/.output.old 2>/dev/null
            sudo mv /home/admin/web/gpa.t00ls.dev/public_html/.output.new /home/admin/web/gpa.t00ls.dev/public_html/.output
            sudo -u admin pm2 reload bench-gpa 2>&1
            sudo -u admin pm2 save 2>&1
            sudo rm -rf /home/admin/web/gpa.t00ls.dev/public_html/.output.old 2>/dev/null
