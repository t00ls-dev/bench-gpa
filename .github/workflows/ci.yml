name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # fetch-depth: 0 → histórico git completo. O prebuild (gendocmeta) usa
      # `git log -1 --format=%ct` por doc para o "timeago" das docs; com o
      # checkout raso (depth 1) todo doc herdaria o timestamp do HEAD.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # Relatório completo é sempre impresso (visibilidade), mas só falha o
      # build em severidade crítica — moderate/high de hoje são só toolchain
      # de build/lint (vite/postcss/js-yaml/babel), não caminho de request.
      # Isso é o que teria pego a regressão do seroval (GHSA-mv8w-475r-vwqw)
      # automaticamente, em vez de precisar de uma auditoria manual.
      - name: Auditoria de dependências (bun audit)
        run: |
          bun audit || true
          bun audit --audit-level=critical
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: build-output
          path: .output/
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Checkout dá acesso a scripts/ (migrate-schema.sql + migrations/) —
      # o artifact só contém .output/.
      - uses: actions/checkout@v7
      # v8 (ESM): falha em vez de só avisar quando o digest do artifact não bate
      # — um artifact corrompido aborta o deploy ANTES do swap.
      #
      # NODE_OPTIONS=--no-deprecation: a action ainda usa o construtor legado
      # `Buffer()` numa dependência transitiva e emite [DEP0005] a cada deploy
      # (verificado: persiste na v8). Como o código é de terceiros, só resta
      # silenciar. O escopo é este step apenas — nada nosso roda aqui.
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: "--no-deprecation"
        with:
          name: build-output
          path: .output/

      - name: Upload .output + arquivos de migração via rsync
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_CMD="ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          REMOTE=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/admin/web/gpa.t00ls.dev/public_html
          rsync -az --delete -e "$SSH_CMD" .output/ "$REMOTE/.output.new/"
          # Runner + baseline + migrations versionadas → $APPDIR/_migrations/
          rsync -az -e "$SSH_CMD" \
            scripts/run-migrations.sh scripts/migrate-schema.sql scripts/migrations \
            "$REMOTE/_migrations/"

          # src/ + scripts/ + manifesto de deps: os cron jobs (cli:purge,
          # cli:refresh-universe) rodam `bun run scripts/X.ts` direto no
          # checkout do servidor, fora do bundle do .output — precisam do
          # próprio TS fonte, não só do build. Até 30/07/2026 esse checkout
          # era um clone manual nunca resincronizado (apontava pro remote
          # errado, sem credencial pra pull de repo privado): as crons rodavam
          # código de semanas atrás sem ninguém perceber. Ver docs/continuar.md
          # item 5.
          #
          # Vai para .cronsrc.new/, NÃO direto em src/scripts/etc — esses
          # caminhos já existem no servidor com dono admin:www-data (o usuário
          # de deploy do rsync não tem permissão de escrita neles; testado
          # manualmente em 30/07/2026, rsync direto falha com "Permission
          # denied" em toda árvore). O staging fica com o dono do usuário do
          # rsync (sem conflito, é um diretório novo) e o swap pro lugar certo
          # com sudo acontece no step seguinte — mesmo padrão do
          # .output.new → .output logo abaixo.
          #
          # `|| echo` em cada linha: o shell do step tem -e por padrão — sem
          # isto, uma falha aqui abortaria o STEP inteiro (que já rodou o
          # rsync crítico do .output/ antes) e bloquearia migrations/atomic
          # swap por um problema que não afeta o app rodando. Mesmo raciocínio
          # do continue-on-error no step seguinte.
          rsync -az --mkpath --delete -e "$SSH_CMD" src/ "$REMOTE/.cronsrc.new/src/" \
            || echo "AVISO: falha ao sincronizar src/ (cron scripts podem ficar desatualizados)"
          rsync -az --mkpath --delete -e "$SSH_CMD" scripts/ "$REMOTE/.cronsrc.new/scripts/" \
            || echo "AVISO: falha ao sincronizar scripts/ (cron scripts podem ficar desatualizados)"
          rsync -az --mkpath -e "$SSH_CMD" package.json bun.lock tsconfig.json bunfig.toml "$REMOTE/.cronsrc.new/" \
            || echo "AVISO: falha ao sincronizar manifesto de deps (cron scripts podem ficar desatualizados)"

      # Independente do resto do deploy: só afeta o checkout usado pelos cron
      # jobs, não o app rodando (que é o bundle self-contained em .output/).
      # Medido na própria VPS (30/07/2026): 41s do zero, sem estresse de
      # memória (1 núcleo, 1,9 GB); ~1s quando node_modules já bate com
      # bun.lock, que é o caso comum (só mudou dependência 1 de ~50 deploys
      # até aqui). Guarda com `[ -d "$STAGE" ]` porque o step anterior pode
      # ter falhado o rsync (viram os `|| echo` acima) e deixado sem staging —
      # sem a guarda, o `mv` de um diretório inexistente abortaria este step
      # à toa mesmo já tendo continue-on-error.
      #
      # continue-on-error: uma falha aqui (rede, npm fora do ar) não pode travar
      # o deploy do app de verdade — migrations e o atomic swap seguem mesmo
      # que este step falhe. O pior caso é a próxima cron rodar código de um
      # deploy atrás até o deploy seguinte corrigir; o app em produção nunca
      # fica pendurado esperando isto.
      - name: Atualiza checkout e dependências usados pelas crons
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -euo pipefail
            APPDIR=/home/admin/web/gpa.t00ls.dev/public_html
            STAGE="$APPDIR/.cronsrc.new"
            if [ -d "$STAGE" ]; then
              sudo chown -R admin:www-data "$STAGE"
              for item in src scripts package.json bun.lock tsconfig.json bunfig.toml; do
                sudo rm -rf "$APPDIR/$item"
                sudo mv "$STAGE/$item" "$APPDIR/$item"
              done
              sudo rm -rf "$STAGE"
              cd "$APPDIR"
              sudo -u admin bun install --frozen-lockfile
            else
              echo "AVISO: staging .cronsrc.new ausente (rsync anterior deve ter falhado) — pulando"
            fi

      # Migrations ANTES do swap: o baseline é idempotente e backward-compatible
      # (re-sincroniza procedures sem quebrar o código antigo ainda em execução).
      # Se falhar, o job para aqui — nenhum código novo é ativado e o app atual
      # segue rodando no schema anterior.
      - name: Aplicar migrations de banco
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -euo pipefail
            APPDIR=/home/admin/web/gpa.t00ls.dev/public_html
            bash "$APPDIR/_migrations/run-migrations.sh" "$APPDIR/.env"

      - name: Atomic swap + Restart PM2 (com rollback automático)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -euo pipefail
            APPDIR=/home/admin/web/gpa.t00ls.dev/public_html
            cd "$APPDIR"

            rollback() {
              echo "FALHA no deploy — revertendo para o build anterior"
              sudo -u admin pm2 delete bench-gpa >&2 || true
              sudo rm -rf "$APPDIR/.output"
              if [ -d "$APPDIR/.output.old" ]; then
                sudo mv "$APPDIR/.output.old" "$APPDIR/.output"
                sudo -u admin pm2 start ecosystem.config.cjs >&2 || true
                sudo -u admin pm2 save >&2 || true
              fi
              exit 1
            }

            sudo chown -R admin:www-data "$APPDIR/.output.new/"
            sudo rm -rf "$APPDIR/.output.old"
            sudo mv "$APPDIR/.output" "$APPDIR/.output.old" 2>/dev/null || true
            sudo mv "$APPDIR/.output.new" "$APPDIR/.output"

            # startOrReload é idempotente: sobe se não existe, recarrega se já
            # existe. Substitui o par delete+start, que sempre logava
            # "[PM2][WARN] Applications bench-gpa not running" e deixava o app
            # fora do PM2 entre os dois comandos. --update-env força reler o
            # ecosystem.config.cjs (e o .env que ele carrega); sem a flag, o
            # reload preservaria o ambiente da execução anterior.
            # Obs.: com exec_mode "fork" o reload equivale a restart — o blip é
            # curto, mas não é zero-downtime.
            sudo -u admin pm2 startOrReload ecosystem.config.cjs --update-env || rollback

            sleep 3
            curl -sf --max-time 10 http://127.0.0.1:3000/ -o /dev/null || rollback

            sudo -u admin pm2 save
            sudo rm -rf "$APPDIR/.output.old"
