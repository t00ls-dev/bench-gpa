name: CI/CD

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type HIBERNATE to decommission Bench GPA
        required: true

permissions:
  contents: read

jobs:
  decommission:
    name: Decommission Bench GPA
    if: github.ref == 'refs/heads/chore/hibernate-project' && inputs.confirm == 'HIBERNATE'
    runs-on: ubuntu-latest
    steps:
      - name: Remove runtime, database, hosting, and deploy access
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          deploy_key_b64=$(ssh-keygen -y -f ~/.ssh/deploy_key | base64 -w0)

          ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_KEY_B64='$deploy_key_b64' bash -s" <<'REMOTE'
          set -euo pipefail

          sudo -u admin pm2 delete bench-gpa
          sudo -u admin pm2 save

          sudo /usr/local/hestia/bin/v-delete-cron-job admin 2
          sudo /usr/local/hestia/bin/v-delete-cron-job admin 1

          sudo /usr/local/hestia/bin/v-delete-database admin admin_gpa
          sudo /usr/local/hestia/bin/v-delete-web-domain admin gpa.t00ls.dev

          ! sudo -u admin pm2 describe bench-gpa >/dev/null 2>&1
          ! sudo /usr/local/hestia/bin/v-list-cron-jobs admin json | grep -q 'gpa.t00ls.dev'
          ! sudo /usr/local/hestia/bin/v-list-database admin admin_gpa json >/dev/null 2>&1
          ! sudo /usr/local/hestia/bin/v-list-web-domain admin gpa.t00ls.dev json >/dev/null 2>&1
          ! sudo test -e /home/admin/web/gpa.t00ls.dev

          deploy_key=$(printf '%s' "$DEPLOY_KEY_B64" | base64 -d)
          deploy_key_blob=$(printf '%s' "$deploy_key" | cut -d ' ' -f 2)
          auth_keys="$HOME/.ssh/authorized_keys"
          temp_keys=$(mktemp "$HOME/.ssh/authorized_keys.XXXXXX")
          awk -v key="$deploy_key_blob" '
            {
              keep = 1
              for (i = 1; i <= NF; i++) {
                if ($i == key) keep = 0
              }
              if (keep) print
            }
          ' "$auth_keys" > "$temp_keys"
          chmod 600 "$temp_keys"
          mv "$temp_keys" "$auth_keys"
          REMOTE

      - name: Delete Sentry project
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/sentry-response \
            --write-out '%{http_code}' --request DELETE \
            --header "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "https://sentry.io/api/0/projects/$SENTRY_ORG/$SENTRY_PROJECT/")
          if [ "$status" != "204" ] && [ "$status" != "404" ]; then
            cat /tmp/sentry-response
            exit 1
          fi
