name: CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Hibernation inventory
    if: github.ref == 'refs/heads/chore/hibernate-project'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Bench GPA infrastructure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -euo pipefail

            echo "== PM2 =="
            sudo -u admin pm2 status bench-gpa || true

            echo "== Hestia web domain =="
            sudo /usr/local/hestia/bin/v-list-web-domain admin gpa.t00ls.dev json || true

            echo "== Hestia databases =="
            sudo /usr/local/hestia/bin/v-list-databases admin json || true

            echo "== Hestia cron jobs =="
            sudo /usr/local/hestia/bin/v-list-cron-jobs admin json || true

            echo "== Hestia backups =="
            sudo /usr/local/hestia/bin/v-list-user-backups admin json || true

            echo "== Application directory =="
            sudo test -d /home/admin/web/gpa.t00ls.dev/public_html && echo present || echo absent
