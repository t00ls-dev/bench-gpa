name: CI/CD
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # fetch-depth: 0 -> full git history. The prebuild (gendocmeta) uses
      # `git log -1 --format=%ct` per doc for the docs' "timeago"; with a
      # shallow checkout (depth 1) every doc would inherit HEAD's timestamp.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify deployment source
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual production deploys must run from main"
              exit 1
            fi
            exit 0
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Production release tags must point to a commit in main"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # The full report is always printed (visibility), but only fails the
      # build on critical severity -- today's moderate/high findings are all
      # build/lint toolchain (vite/postcss/js-yaml/babel), not the request
      # path. This is what would have caught the seroval regression
      # (GHSA-mv8w-475r-vwqw) automatically, instead of needing a manual audit.
      - name: Dependency audit (bun audit)
        run: |
          bun audit || true
          bun audit --audit-level=critical
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Routine CI builds are discarded and must not create Sentry
          # releases. The token is exposed only to explicit deploy builds.
          SENTRY_AUTH_TOKEN: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      - uses: actions/upload-artifact@v7
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        with:
          name: build-output
          path: .output/
          retention-days: 1
          include-hidden-files: true

  schema-check:
    name: Schema (MariaDB real)
    runs-on: ubuntu-latest
    concurrency:
      group: schema-check-${{ github.ref }}
      cancel-in-progress: true
    # Proves that migrate-schema.sql + scripts/migrations/*.sql apply
    # cleanly on a fresh install (empty database), and that running them
    # again is a no-op -- before this job, that was never tested (only
    # already-migrated environments, where a broken ALTER would never have
    # a chance to show up). Found 2 real bugs on its first run:
    # docs/auditoria-qa-2026-08-01.md, item 10.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bench_gpa_ci
        ports:
          - 3306:3306
        # healthcheck.sh ships with the official image itself (mariadb.org),
        # built for this entrypoint's two phases (temporary init server,
        # then the real one) -- `mysqladmin ping`, tried before, stayed
        # "unhealthy" until it burned through all 10 retries even with the
        # server already ready (the log showed "ready for connections" well
        # before the timeout), because of the phase switch.
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - name: Install mariadb client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Apply schema from scratch and prove idempotency (runs 2x)
        run: |
          cat > /tmp/schema-check.env <<EOF
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=bench_gpa_ci
          DB_USER=root
          DB_PASS=root
          EOF

          echo "==> 1st application (empty database)"
          bash scripts/run-migrations.sh /tmp/schema-check.env

          echo "==> 2nd application (idempotency, must be a no-op on versioned migrations)"
          bash scripts/run-migrations.sh /tmp/schema-check.env | tee /tmp/second-run.log
          grep -q "no new migrations" /tmp/second-run.log

  deploy:
    name: Deploy
    needs: [ci, schema-check]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Checkout gives access to scripts/ (migrate-schema.sql + migrations/)
      # -- the artifact only contains .output/.
      - uses: actions/checkout@v7
      # v8 (ESM): fails instead of just warning when the artifact's digest
      # doesn't match -- a corrupted artifact aborts the deploy BEFORE the swap.
      #
      # NODE_OPTIONS=--no-deprecation: the action still uses the legacy
      # `Buffer()` constructor in a transitive dependency and emits
      # [DEP0005] on every deploy (verified: persists on v8). Since it's
      # third-party code, all that's left is to silence it. The scope is
      # this step only -- nothing of ours runs here.
      - uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: "--no-deprecation"
        with:
          name: build-output
          path: .output/

      - name: Upload .output + migration files via rsync
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_CMD="ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          REMOTE=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/admin/web/gpa.t00ls.dev/public_html
          rsync -az --delete -e "$SSH_CMD" .output/ "$REMOTE/.output.new/"

          # ecosystem.config.cjs lives at the root of $APPDIR, outside
          # .output/ (Nitro's self-contained bundle): it was never part of
          # any rsync in this workflow, so a change to it (instances,
          # exec_mode, etc.) never actually reached the server until someone
          # copied it manually (found on 08/04/2026, during the migration to
          # PM2 cluster mode: PR merged, CI green, deploy "successful", and
          # the server kept running fork/1 instance because pm2
          # startOrReload was reading the old config). No --delete/staging
          # needed: a single-file rsync already writes to a temp file and
          # renames over the target, atomic by default, no need for the same
          # .new/swap dance as .output/. Deliberately outside the
          # failure-tolerant block (cron scripts, further below): this
          # controls how many workers come up and in what mode, just as
          # critical as .output/ itself.
          rsync -az -e "$SSH_CMD" ecosystem.config.cjs "$REMOTE/"

          # Runner + baseline + versioned migrations -> $APPDIR/_migrations/
          rsync -az -e "$SSH_CMD" \
            scripts/run-migrations.sh scripts/migrate-schema.sql scripts/migrations \
            "$REMOTE/_migrations/"

          # src/ + scripts/ + deps manifest: the cron jobs (cli:purge,
          # cli:refresh-universe) run `bun run scripts/X.ts` directly on the
          # server's checkout, outside the .output bundle -- they need the
          # actual TS source, not just the build. Until 07/30/2026 that
          # checkout was a manual clone that was never resynced (pointed to
          # the wrong remote, no credential to pull a private repo): the
          # crons were running weeks-old code without anyone noticing. See
          # docs/continuar.md item 5.
          #
          # Goes to .cronsrc.new/, NOT directly into src/scripts/etc -- those
          # paths already exist on the server owned by admin:www-data (the
          # rsync deploy user has no write permission on them; tested
          # manually on 07/30/2026, a direct rsync fails with "Permission
          # denied" across the whole tree). The staging area is owned by the
          # rsync user (no conflict, it's a new directory) and the swap into
          # the right place with sudo happens in the next step -- same
          # pattern as .output.new -> .output right below.
          #
          # `|| echo` on every line: the step's shell has -e by default --
          # without this, a failure here would abort the ENTIRE step (which
          # already ran the critical .output/ rsync before it) and block
          # migrations/atomic swap over a problem that doesn't affect the
          # running app. Same reasoning as the continue-on-error in the next step.
          rsync -az --mkpath --delete -e "$SSH_CMD" src/ "$REMOTE/.cronsrc.new/src/" \
            || echo "WARNING: failed to sync src/ (cron scripts may be stale)"
          rsync -az --mkpath --delete -e "$SSH_CMD" scripts/ "$REMOTE/.cronsrc.new/scripts/" \
            || echo "WARNING: failed to sync scripts/ (cron scripts may be stale)"
          rsync -az --mkpath -e "$SSH_CMD" package.json bun.lock tsconfig.json bunfig.toml "$REMOTE/.cronsrc.new/" \
            || echo "WARNING: failed to sync deps manifest (cron scripts may be stale)"

      # Independent from the rest of the deploy: only affects the checkout
      # used by the cron jobs, not the running app (which is the
      # self-contained bundle in .output/). Measured on the VPS itself
      # (07/30/2026): 41s from scratch, no memory stress (1 core, 1.9 GB);
      # ~1s when node_modules already matches bun.lock, which is the common
      # case (a dependency only changed 1 out of ~50 deploys so far).
      # Guarded with `[ -d "$STAGE" ]` because the previous step may have
      # failed the rsync (became the `|| echo` above) and left no staging --
      # without the guard, `mv`-ing a nonexistent directory would abort this
      # step for nothing even with continue-on-error already set.
      #
      # continue-on-error: a failure here (network, npm down) must not block
      # the real app deploy -- migrations and the atomic swap proceed even
      # if this step fails. The worst case is the next cron run using code
      # from one deploy behind until the following deploy fixes it; the app
      # in production never hangs waiting on this.
      - name: Update checkout and dependencies used by the crons
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -euo pipefail
            APPDIR=/home/admin/web/gpa.t00ls.dev/public_html
            STAGE="$APPDIR/.cronsrc.new"
            if [ -d "$STAGE" ]; then
              sudo chown -R admin:www-data "$STAGE"
              for item in src scripts package.json bun.lock tsconfig.json bunfig.toml; do
                sudo rm -rf "$APPDIR/$item"
                sudo mv "$STAGE/$item" "$APPDIR/$item"
              done
              sudo rm -rf "$STAGE"
              cd "$APPDIR"
              # --production: the two cron scripts (cli:purge,
              # cli:refresh-universe) only import production dependencies
              # (confirmed in the imports of scripts/purge-aggs.ts and
              # scripts/refresh-universe.ts). Without this, every deploy
              # reinstalled the entire set of devDependencies here, including
              # puppeteer, whose postinstall downloads a ~700MB Chromium that
              # nothing on this server uses (08/04/2026, ~2G reclaimed in the cleanup).
              sudo -u admin bun install --frozen-lockfile --production
            else
              echo "WARNING: staging .cronsrc.new missing (previous rsync must have failed), skipping"
            fi

      # Migrations BEFORE the swap: the baseline is idempotent and
      # backward-compatible (re-syncs procedures without breaking the old
      # code still running). If it fails, the job stops here -- no new code
      # is activated and the current app keeps running on the previous schema.
      - name: Apply database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -euo pipefail
            APPDIR=/home/admin/web/gpa.t00ls.dev/public_html
            bash "$APPDIR/_migrations/run-migrations.sh" "$APPDIR/.env"

      - name: Atomic swap (versioned release) + Restart PM2 (with automatic rollback)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -euo pipefail
            APPDIR=/home/admin/web/gpa.t00ls.dev/public_html
            cd "$APPDIR"

            # Versioned release + "current" symlink (no longer swapping
            # content at the SAME ".output" path): found on 08/04/2026, the
            # third rollback of the day. Cluster mode's reload swaps workers
            # one at a time (~10-20s total); with the old scheme, the old
            # worker -- still up, still receiving real traffic -- kept
            # reading any asset on demand (old hash, not cached in memory)
            # from the ".output" path, which that very swap had already
            # pointed at the NEW build underneath it: a real ENOENT/500,
            # caught both by the healthcheck below and by a real user during
            # that window. See docs/medicao-performance.md.
            #
            # Each release goes to releases/<timestamp>-<sha>/, never
            # rewritten. Node resolves the entry module's REAL path (follows
            # the symlink) on the initial import(): once up, each worker
            # stays pinned forever to its own releases/.../ -- no old worker
            # ever reads again from a path whose content changed underneath it.
            RELEASE_SHA="${{ github.sha }}"
            RELEASE="$APPDIR/releases/$(date +%Y%m%d%H%M%S)-${RELEASE_SHA:0:7}"
            PREV_RELEASE=$(readlink -f "$APPDIR/current" 2>/dev/null || true)

            rollback() {
              echo "DEPLOY FAILED, rolling back to the previous release"
              sudo -u admin pm2 delete bench-gpa >&2 || true
              if [ -n "$PREV_RELEASE" ] && [ -d "$PREV_RELEASE" ]; then
                sudo ln -sfn "$PREV_RELEASE" "$APPDIR/current"
                sudo -u admin pm2 start ecosystem.config.cjs >&2 || true
                sudo -u admin pm2 save >&2 || true
              fi
              sudo rm -rf "$RELEASE"
              exit 1
            }

            sudo mkdir -p "$APPDIR/releases"
            sudo chown -R admin:www-data "$APPDIR/.output.new/"
            sudo mv "$APPDIR/.output.new" "$RELEASE"
            sudo ln -sfn "$RELEASE" "$APPDIR/current"

            # startOrReload is idempotent: comes up if it doesn't exist,
            # reloads if it does. --update-env forces it to re-read
            # ecosystem.config.cjs (and the .env it loads); without the
            # flag, the reload would preserve the previous run's
            # environment. listen_timeout: 8000 (ecosystem.config.cjs) gives
            # PM2 real headroom for the single worker's full boot. With
            # exec_mode "fork" the reload is equivalent to a restart -- the
            # blip is short, but it isn't zero-downtime.
            #
            # Retry on the reload (not just the healthcheck): kept as a
            # cheap, generic safety net against any transient boot failure
            # (a slow MariaDB connection, a hiccup acquiring the port),
            # even though the specific bug that originally motivated this
            # (Unitech/pm2#3946, "TCP port isn't released on reload when
            # app is running in cluster mode") no longer applies now that
            # PM2 runs in fork mode (see docs/medicao-performance.md,
            # 2026-08-06 entry). Each attempt here is independent of the
            # last, so the odds of all 3 failing at once are already
            # residual; if it happens anyway, it's a genuine rollback, not
            # a masked one.
            ok=""
            for attempt in 1 2 3; do
              sudo -u admin pm2 startOrReload ecosystem.config.cjs --update-env || true
              healthy=""
              for check in 1 2; do
                sleep 2
                if curl -sf --max-time 10 http://127.0.0.1:3000/ -o /dev/null; then
                  healthy=1
                  break
                fi
              done
              if [ -n "$healthy" ]; then
                ok=1
                break
              fi
              echo "attempt $attempt of reload did not respond to the healthcheck, retrying"
            done
            [ -n "$ok" ] || rollback

            sudo -u admin pm2 save

            # Keeps the last 5 releases: the old process has already been
            # replaced and confirmed dead by pm2 startOrReload above (the
            # command blocks until the reload finishes), nothing reads from
            # them anymore. Just disk space, not correctness -- 18M each,
            # huge slack (the VPS has ~9.5G free).
            cd "$APPDIR/releases" && ls -1t | tail -n +6 | xargs -r sudo rm -rf
