name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: build-output
          path: .output/
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Checkout dá acesso a scripts/ (migrate-schema.sql + migrations/) —
      # o artifact só contém .output/.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: build-output
          path: .output/

      - name: Upload .output + arquivos de migração via rsync
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_CMD="ssh -p ${{ secrets.VPS_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
          REMOTE=${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/admin/web/gpa.t00ls.dev/public_html
          rsync -az --delete -e "$SSH_CMD" .output/ "$REMOTE/.output.new/"
          # Runner + baseline + migrations versionadas → $APPDIR/_migrations/
          rsync -az -e "$SSH_CMD" \
            scripts/run-migrations.sh scripts/migrate-schema.sql scripts/migrations \
            "$REMOTE/_migrations/"

      # Migrations ANTES do swap: o baseline é idempotente e backward-compatible
      # (re-sincroniza procedures sem quebrar o código antigo ainda em execução).
      # Se falhar, o job para aqui — nenhum código novo é ativado e o app atual
      # segue rodando no schema anterior.
      - name: Aplicar migrations de banco
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -euo pipefail
            APPDIR=/home/admin/web/gpa.t00ls.dev/public_html
            bash "$APPDIR/_migrations/run-migrations.sh" "$APPDIR/.env"

      - name: Atomic swap + Restart PM2 (com rollback automático)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30s
          command_timeout: 3m
          script: |
            set -euo pipefail
            APPDIR=/home/admin/web/gpa.t00ls.dev/public_html
            cd "$APPDIR"

            rollback() {
              echo "FALHA no deploy — revertendo para o build anterior"
              sudo -u admin pm2 delete bench-gpa >&2 || true
              sudo rm -rf "$APPDIR/.output"
              if [ -d "$APPDIR/.output.old" ]; then
                sudo mv "$APPDIR/.output.old" "$APPDIR/.output"
                sudo -u admin pm2 start ecosystem.config.cjs >&2 || true
                sudo -u admin pm2 save >&2 || true
              fi
              exit 1
            }

            sudo chown -R admin:www-data "$APPDIR/.output.new/"
            sudo rm -rf "$APPDIR/.output.old"
            sudo mv "$APPDIR/.output" "$APPDIR/.output.old" 2>/dev/null || true
            sudo mv "$APPDIR/.output.new" "$APPDIR/.output"

            sudo -u admin pm2 delete bench-gpa >&2 || true
            sudo -u admin pm2 start ecosystem.config.cjs || rollback

            sleep 3
            curl -sf --max-time 10 http://127.0.0.1:3000/ -o /dev/null || rollback

            sudo -u admin pm2 save
            sudo rm -rf "$APPDIR/.output.old"
