version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Packages in the ESLint "family" tend to require mutually compatible
      # versions (eslint + @eslint/js + plugins). In separate PRs, each one
      # conflicts with the others in bun.lock and needs manual resolution --
      # grouped, they come up together, get tested together, in a single CI run.
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
      # Patch/minor for everything else: low risk, doesn't need a PR per
      # package -- cuts the volume without hiding majors (which still show
      # up separately, deliberately requiring individual review).
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
